<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    .flag{
      background-color: #CE1126;
      position : relative;
      width: 900px;
      height: 600px;
      margin : 0px;
    }

    .flag > div {
      background-color: rgb(4, 4, 99);/*good*/
      height: 300px;/*good*/
      width : 100%;
      position : absolute;
      top : 150px;
    }

    .flag > p{ /*All good*/
      color:white;/*good*/
    }

    p{
      text-align: center;/*good*/
      font-size: 5rem;/*good*/
      margin:0px; /*missing*/
      padding:0px; /*missing*/
    }

    div div div{ /*All Good*/
      background-color: white; /*good*/
      width : 200px; /*good*/
      height : 200px;/*good*/
      position : absolute;/*good*/
      top : 50px;/*good*/
      left : 350px;/*good*/
      border-radius: 50%;/*good*/
    }
  </style>
</head>

<!-- 
  IMPORTANT! Do not change any HTML
Don't add any classes/ids/elements 
Use what you know about combining selectors 
and CSS specificity instead.
Hint 1: The flag is 900px by 600px and the circle is 200px by 200px.
Hint 2: You can use CSS inspection to get the colors from
https://appbrewery.github.io/flag-of-laos/
-->

<body>
  <div class="flag">
    <p>The Flag</p>
    <div>
      <div>
        <p>of Laos</p>
      </div>
    </div>
  </div>
</body>

</html>
